<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CW练考通 · 管理后台</title>
<style>
  :root {
    --bg: #12161c;
    --surface: #1e242d;
    --surface2: #0c1015;
    --line: #2a3240;
    --amber: #ffc857;
    --green: #3ddc97;
    --red: #ff7b72;
    --text: #e6edf7;
    --dim: #7a8599;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2530, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 18px 56px;
  }
  .wrap { width: 100%; max-width: 560px; }
  .plate {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    position: relative;
  }
  .plate::before, .plate::after {
    content: "";
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #3a4350;
    top: 10px;
  }
  .plate::before { left: 10px; }
  .plate::after { right: 10px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .led { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px rgba(61,220,151,.8); }
  .led.off { background: #4d5868; box-shadow: none; }
  h1 { margin: 8px 0 2px; font-size: 22px; letter-spacing: 2px; }
  .sub { font-family: var(--mono); font-size: 10px; color: var(--amber); letter-spacing: 1px; }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 18px 0 0; }
  label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--dim);
    margin: 20px 0 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 1px;
    outline: none;
  }
  input:focus { border-color: var(--amber); }
  .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button {
    flex: 1;
    min-width: 120px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary { background: var(--amber); border-color: var(--amber); color: #1a1200; }
  button.danger { border-color: #5c3030; color: var(--red); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .status {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    min-height: 16px;
    white-space: pre-wrap;
  }
  .status.ok { color: var(--green); }
  .status.err { color: var(--red); }
  .card {
    margin-top: 18px;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    background: var(--surface2);
    display: none;
  }
  .card.on { display: block; }
  .state {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
  }
  .meta {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    margin-top: 6px;
    letter-spacing: 1px;
  }
  .divider { border-top: 1px dashed #3a4350; margin: 16px 0; }
  .codes {
    margin: 10px 0 0;
    padding: 10px;
    max-height: 220px;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface2);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--amber);
    white-space: pre-wrap;
    line-height: 1.7;
  }
  .section-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--dim);
  }
  .foot {
    margin-top: 26px;
    text-align: center;
    font-family: var(--mono);
    font-size: 9px;
    color: #4d5868;
    letter-spacing: 1px;
    line-height: 1.8;
  }
  .foot a { color: var(--amber); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="plate">
    <div class="eyebrow"><span id="led" class="led off"></span>MODEL WC-2025 · ADMIN CONSOLE</div>
    <h1>CW练考通</h1>
    <div class="sub">ADMIN · 管理后台</div>
    <p class="hint">
      管理会员功能开关：默认暂不开放。开启后 App 与网页会展示开通入口；
      <b>关闭需要再次输入管理员密码</b>。也可按账号手动开通或取消会员。
    </p>

    <div id="loginBox">
      <label for="pass">管理员密码 ADMIN PASSWORD</label>
      <input id="pass" type="password" placeholder="请输入管理员密码" autocomplete="current-password" />
      <div class="row">
        <button id="login" class="primary">进入后台</button>
      </div>
      <div id="loginStatus" class="status"></div>
    </div>

    <section id="panel" class="card">
      <div class="section-title">会员功能 MEMBER GATE</div>
      <div class="state"><span id="stateLed" class="led off"></span><span id="stateText">—</span></div>
      <div class="meta" id="stateMeta">—</div>

      <div class="row">
        <button id="enable" class="primary">开启会员功能</button>
        <button id="disable" class="danger">关闭会员功能</button>
      </div>
      <div id="status" class="status"></div>

      <div class="divider"></div>
      <div class="section-title">账号会员 MANUAL GRANT</div>
      <label for="grantUser">用户名 USERNAME</label>
      <input id="grantUser" type="text" maxlength="20" placeholder="要开通会员的账号" autocomplete="off" />
      <label for="grantDays">天数 DAYS（0 = 取消会员）</label>
      <input id="grantDays" type="number" min="0" max="3650" value="30" />
      <div class="row">
        <button id="grant">开通 / 续期</button>
        <button id="logout">退出后台</button>
      </div>
      <div id="grantStatus" class="status"></div>

      <div class="divider"></div>
      <div class="section-title">兑换码 REDEEM CODES</div>
      <label for="codeDays">天数 DAYS</label>
      <input id="codeDays" type="number" min="1" max="3650" value="30" />
      <label for="codeCount">数量 COUNT（单次最多 100）</label>
      <input id="codeCount" type="number" min="1" max="100" value="5" />
      <div class="row">
        <button id="genCodes" class="primary">生成兑换码</button>
        <button id="refreshCodes">刷新列表</button>
      </div>
      <div id="codeStatus" class="status"></div>
      <pre id="codeList" class="codes">未加载</pre>
    </section>
  </header>
  <div class="foot">·−·−  CW练考通 · ADMIN · 73  ·−·−·<br />
    <a href="/">同步码模式 ›</a> · <a href="/account.html">账号云同步 ›</a> · <a href="/coach.html">教练看板 ›</a>
  </div>
</div>

<script>
const loginBox = document.getElementById('loginBox')
const panel = document.getElementById('panel')
const loginStatus = document.getElementById('loginStatus')
const statusEl = document.getElementById('status')
const grantStatus = document.getElementById('grantStatus')
const codeStatus = document.getElementById('codeStatus')
const codeList = document.getElementById('codeList')
let adminToken = sessionStorage.getItem('cw_admin_token') || ''

function setStatus(el, text, kind) {
  el.textContent = text
  el.className = 'status' + (kind ? ' ' + kind : '')
}

function headers(extra) {
  const out = { ...extra }
  if (adminToken) out['x-admin-token'] = adminToken
  return out
}

function render(cfg) {
  if (!cfg) return
  document.getElementById('stateText').textContent = cfg.enabled ? '已开放' : '暂未开放'
  const led = document.getElementById('stateLed')
  led.className = 'led' + (cfg.enabled ? '' : ' off')
  document.getElementById('led').className = 'led' + (cfg.enabled ? '' : ' off')
  document.getElementById('stateMeta').textContent =
    '价格 ¥' + (cfg.price || 18) + ' / 月 · 最近变更 ' +
    (cfg.updatedAt ? new Date(cfg.updatedAt).toLocaleString() : '从未')
  document.getElementById('enable').disabled = cfg.enabled
  document.getElementById('disable').disabled = !cfg.enabled
  panel.classList.add('on')
  loginBox.style.display = 'none'
  loadCodes().catch((error) => setStatus(codeStatus, error.message, 'err'))
}

async function loadState() {
  const res = await fetch('/api/admin/member', { headers: headers() })
  if (res.status === 401) {
    adminToken = ''
    sessionStorage.removeItem('cw_admin_token')
    throw new Error('登录已失效，请重新输入密码')
  }
  const data = await res.json().catch(() => ({}))
  if (!res.ok || !data.ok) throw new Error(data.error || '读取失败')
  render(data)
}

document.getElementById('login').addEventListener('click', async () => {
  setStatus(loginStatus, '验证中…')
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pass').value })
    })
    const data = await res.json().catch(() => ({}))
    if (!res.ok || !data.ok) throw new Error(data.error || '登录失败')
    adminToken = data.token
    sessionStorage.setItem('cw_admin_token', adminToken)
    document.getElementById('pass').value = ''
    setStatus(loginStatus, '')
    await loadState()
  } catch (error) {
    setStatus(loginStatus, error.message, 'err')
  }
})

async function setEnabled(enabled) {
  let password = ''
  if (!enabled) {
    password = prompt('关闭会员功能需要管理员密码，请再次输入：') || ''
    if (!password) return setStatus(statusEl, '已取消关闭', 'err')
  }
  setStatus(statusEl, '提交中…')
  try {
    const res = await fetch('/api/admin/member', {
      method: 'POST',
      headers: headers({ 'content-type': 'application/json' }),
      body: JSON.stringify({ enabled, password })
    })
    const data = await res.json().catch(() => ({}))
    if (!res.ok || !data.ok) throw new Error(data.error || '操作失败')
    render(data)
    setStatus(statusEl, enabled ? '会员功能已开启' : '会员功能已关闭', 'ok')
  } catch (error) {
    setStatus(statusEl, error.message, 'err')
  }
}

document.getElementById('enable').addEventListener('click', () => setEnabled(true))
document.getElementById('disable').addEventListener('click', () => setEnabled(false))

document.getElementById('grant').addEventListener('click', async () => {
  setStatus(grantStatus, '提交中…')
  try {
    const res = await fetch('/api/admin/grant', {
      method: 'POST',
      headers: headers({ 'content-type': 'application/json' }),
      body: JSON.stringify({
        username: document.getElementById('grantUser').value.trim(),
        days: Number(document.getElementById('grantDays').value)
      })
    })
    const data = await res.json().catch(() => ({}))
    if (!res.ok || !data.ok) throw new Error(data.error || '操作失败')
    setStatus(
      grantStatus,
      data.memberUntil
        ? data.username + ' 会员到期 ' + new Date(data.memberUntil).toLocaleString()
        : data.username + ' 会员已取消',
      'ok'
    )
  } catch (error) {
    setStatus(grantStatus, error.message, 'err')
  }
})

async function loadCodes() {
  const res = await fetch('/api/admin/codes', { headers: headers() })
  const data = await res.json().catch(() => ({}))
  if (!res.ok || !data.ok) throw new Error(data.error || '读取失败')
  const unused = (data.codes || []).filter((c) => !c.usedBy)
  codeList.textContent = unused.length
    ? unused.map((c) => c.code + '  ·  ' + c.days + ' 天').join('\n')
    : '暂无未使用兑换码'
  setStatus(codeStatus, '未使用 ' + data.unused + ' 个 / 共 ' + data.total + ' 个', 'ok')
}

document.getElementById('genCodes').addEventListener('click', async () => {
  setStatus(codeStatus, '生成中…')
  try {
    const res = await fetch('/api/admin/codes', {
      method: 'POST',
      headers: headers({ 'content-type': 'application/json' }),
      body: JSON.stringify({
        days: Number(document.getElementById('codeDays').value),
        count: Number(document.getElementById('codeCount').value)
      })
    })
    const data = await res.json().catch(() => ({}))
    if (!res.ok || !data.ok) throw new Error(data.error || '生成失败')
    codeList.textContent = data.codes.join('\n')
    setStatus(codeStatus, '已生成 ' + data.codes.length + ' 个 · ' + data.days + ' 天，请复制保存', 'ok')
  } catch (error) {
    setStatus(codeStatus, error.message, 'err')
  }
})

document.getElementById('refreshCodes').addEventListener('click', () => {
  loadCodes().catch((error) => setStatus(codeStatus, error.message, 'err'))
})

document.getElementById('logout').addEventListener('click', () => {
  adminToken = ''
  sessionStorage.removeItem('cw_admin_token')
  panel.classList.remove('on')
  loginBox.style.display = ''
  setStatus(loginStatus, '已退出后台')
})

if (adminToken) {
  loadState().catch((error) => {
    setStatus(loginStatus, error.message, 'err')
    loginBox.style.display = ''
  })
}
</script>
</body>
</html>
