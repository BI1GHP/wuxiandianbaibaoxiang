<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CW练考通 · 账号云同步</title>
<style>
  :root {
    --bg: #12161c;
    --surface: #1e242d;
    --surface2: #0c1015;
    --line: #2a3240;
    --amber: #ffc857;
    --green: #3ddc97;
    --text: #e6edf7;
    --dim: #7a8599;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2530, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 18px 56px;
  }
  .wrap { width: 100%; max-width: 520px; }
  .plate {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    position: relative;
  }
  .plate::before, .plate::after {
    content: "";
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #3a4350;
    top: 10px;
  }
  .plate::before { left: 10px; }
  .plate::after { right: 10px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .led {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px rgba(61, 220, 151, .8);
  }
  h1 { margin: 8px 0 2px; font-size: 22px; letter-spacing: 2px; }
  .sub {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--amber);
    letter-spacing: 1px;
  }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 18px 0 0; }
  label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--dim);
    margin: 20px 0 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 1px;
    outline: none;
  }
  input:focus { border-color: var(--amber); }
  .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button {
    flex: 1;
    min-width: 120px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary { background: var(--amber); border-color: var(--amber); color: #1a1200; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .status {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    min-height: 16px;
    white-space: pre-wrap;
  }
  .status.ok { color: var(--green); }
  .status.err { color: #ff7b72; }
  .card {
    margin-top: 18px;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    background: var(--surface2);
    display: none;
  }
  .card.on { display: block; }
  .user { font-family: var(--mono); font-size: 20px; font-weight: 800; letter-spacing: 2px; }
  .divider { border-top: 1px dashed #3a4350; margin: 16px 0 4px; }
  .section-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .card input { margin-top: 8px; }
  .meta {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    margin-top: 4px;
    letter-spacing: 1px;
  }
  .foot {
    margin-top: 26px;
    text-align: center;
    font-family: var(--mono);
    font-size: 9px;
    color: #4d5868;
    letter-spacing: 1px;
    line-height: 1.8;
  }
  .foot a { color: var(--amber); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="plate">
    <div class="eyebrow"><span class="led"></span>MODEL WC-2025 · ACCOUNT STATION</div>
    <h1>CW练考通</h1>
    <div class="sub">ACCOUNT SYNC · 账号云同步</div>
    <p class="hint">
      注册一个账号即可在 App 与网页之间同步进度，密码只保存加盐哈希。
      网页端登录后可上传或下载同一份备份；手机端在「设置 → 账号云同步」使用同样的地址与账号。
    </p>

    <label for="user">用户名 USERNAME</label>
    <input id="user" type="text" maxlength="20" placeholder="3–20 位字母、数字或下划线" autocomplete="username" />

    <label for="pass">密码 PASSWORD</label>
    <input id="pass" type="password" maxlength="64" placeholder="至少 6 位" autocomplete="current-password" />

    <div class="row">
      <button id="login" class="primary">登录</button>
      <button id="register">注册新账号</button>
    </div>
    <div id="status" class="status"></div>

    <section id="card" class="card">
      <div class="user" id="who">—</div>
      <div class="meta" id="meta">—</div>
      <div class="row">
        <button id="pull">下载并查看进度</button>
        <button id="choose">上传备份</button>
        <input id="file" type="file" accept="application/json,.json" hidden />
      </div>
      <div class="row">
        <button id="download" disabled>下载备份 JSON</button>
        <button id="logout">退出登录</button>
      </div>

      <div class="divider"></div>
      <div class="section-title">会员 MEMBERSHIP</div>
      <div class="meta" id="memberMeta">—</div>
      <div class="row">
        <input id="redeem" type="text" maxlength="16" placeholder="兑换码 REDEEM CODE" autocomplete="off" />
        <button id="redeemBtn">兑换开通</button>
      </div>
      <div id="memberStatus" class="status"></div>
    </section>
  </header>
  <div class="foot">·−·−  CW练考通 · LOCAL FIRST · 73  ·−·−·<br />
    <a href="/">同步码模式 ›</a> · <a href="/coach.html">教练看板 ›</a>
  </div>
</div>

<script>
const userInput = document.getElementById('user')
const passInput = document.getElementById('pass')
const statusEl = document.getElementById('status')
const card = document.getElementById('card')
let token = sessionStorage.getItem('cw_account_token') || ''
let current = null

function setStatus(text, kind) {
  statusEl.textContent = text
  statusEl.className = 'status' + (kind ? ' ' + kind : '')
}

function headers(extra) {
  const out = { ...extra }
  if (token) out['x-account-token'] = token
  return out
}

async function post(path, body, auth) {
  const res = await fetch(path, {
    method: 'POST',
    headers: headers({ 'content-type': 'application/json' }),
    body: JSON.stringify(body || {})
  })
  const data = await res.json().catch(() => ({}))
  if (!res.ok || !data.ok) throw new Error(data.error || '请求失败')
  return data
}

function render(data) {
  current = data
  document.getElementById('who').textContent = data.username || userInput.value
  document.getElementById('meta').textContent = data.updatedAt
    ? '最近上传 ' + new Date(data.updatedAt).toLocaleString()
    : '该账号还没有上传过进度'
  card.classList.add('on')
  document.getElementById('download').disabled = !data.payload
}

function store(data) {
  token = data.token || ''
  sessionStorage.setItem('cw_account_token', token)
  render(data)
  loadMember()
}

async function loadMember() {
  const el = document.getElementById('memberStatus')
  if (!token) return
  try {
    const res = await fetch('/api/member/status', { headers: headers() })
    const data = await res.json().catch(() => ({}))
    if (!res.ok || !data.ok) throw new Error(data.error || '读取失败')
    document.getElementById('memberMeta').textContent = data.active
      ? 'PLUS · 有效期至 ' + new Date(data.memberUntil).toLocaleDateString()
      : '免费版'
    if (!data.enabled) {
      el.textContent = '会员功能暂未开放'
      el.className = 'status'
    }
  } catch (error) {
    setStatus(el, error.message, 'err')
  }
}

document.getElementById('redeemBtn').addEventListener('click', async () => {
  const el = document.getElementById('memberStatus')
  if (!token) return setStatus(el, '请先登录账号', 'err')
  setStatus(el, '兑换中…')
  try {
    const data = await post('/api/member/redeem', {
      code: document.getElementById('redeem').value.replace(/[^A-Za-z0-9]/g, '')
    })
    document.getElementById('redeem').value = ''
    setStatus(el, '兑换成功 · 有效期至 ' + new Date(data.memberUntil).toLocaleDateString(), 'ok')
    loadMember()
  } catch (error) {
    setStatus(el, error.message, 'err')
  }
})

document.getElementById('register').addEventListener('click', async () => {
  setStatus('注册中…')
  try {
    const data = await post('/api/account/register', {
      username: userInput.value.trim(),
      password: passInput.value
    })
    store(data)
    setStatus('注册成功，已自动登录', 'ok')
  } catch (error) {
    setStatus(error.message, 'err')
  }
})

document.getElementById('login').addEventListener('click', async () => {
  setStatus('登录中…')
  try {
    const data = await post('/api/account/login', {
      username: userInput.value.trim(),
      password: passInput.value
    })
    store(data)
    setStatus(data.hasPayload ? '已登录，可下载进度' : '已登录，请先上传一份备份', 'ok')
    if (data.hasPayload) {
      // 登录后直接取一次，方便查看
      document.getElementById('pull').click()
    }
  } catch (error) {
    setStatus(error.message, 'err')
  }
})

document.getElementById('pull').addEventListener('click', async () => {
  if (!token) return setStatus('请先登录', 'err')
  setStatus('读取中…')
  try {
    const res = await fetch('/api/account/pull', { headers: headers() })
    const data = await res.json().catch(() => ({}))
    if (!res.ok || !data.ok) throw new Error(data.error || '读取失败')
    render(data)
    setStatus('已读取 · ' + new Date(data.updatedAt).toLocaleString(), 'ok')
  } catch (error) {
    setStatus(error.message, 'err')
  }
})

document.getElementById('choose').addEventListener('click', () => {
  if (!token) return setStatus('请先登录，再上传备份', 'err')
  document.getElementById('file').click()
})

document.getElementById('file').addEventListener('change', async (event) => {
  const file = event.target.files?.[0]
  event.target.value = ''
  if (!file) return
  let payload
  try {
    payload = JSON.parse(await file.text())
  } catch {
    return setStatus('备份文件不是有效的 JSON', 'err')
  }
  if (!payload?.prefs) return setStatus('不是 CW练考通 的备份文件', 'err')

  setStatus('上传中…')
  try {
    const data = await post('/api/account/push', { payload })
    current = { ...current, payload, updatedAt: data.updatedAt }
    render({ ...current, username: current?.username || userInput.value })
    setStatus('已上传 · ' + new Date(data.updatedAt).toLocaleString(), 'ok')
  } catch (error) {
    setStatus(error.message, 'err')
  }
})

document.getElementById('download').addEventListener('click', () => {
  if (!current?.payload) return
  const blob = new Blob([JSON.stringify(current.payload, null, 2)], {
    type: 'application/json'
  })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = 'cw_trainer_backup_account.json'
  a.click()
  URL.revokeObjectURL(a.href)
})

document.getElementById('logout').addEventListener('click', () => {
  token = ''
  current = null
  sessionStorage.removeItem('cw_account_token')
  card.classList.remove('on')
  setStatus('已退出登录')
})
</script>
</body>
</html>
