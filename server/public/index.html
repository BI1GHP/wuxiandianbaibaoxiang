<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CW练考通 · 进度同步</title>
<style>
  :root {
    --bg: #12161c;
    --surface: #1e242d;
    --surface2: #0c1015;
    --line: #2a3240;
    --amber: #ffc857;
    --green: #3ddc97;
    --text: #e6edf7;
    --dim: #7a8599;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2530, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 18px 56px;
  }
  .wrap { width: 100%; max-width: 520px; }
  .plate {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    position: relative;
  }
  .plate::before, .plate::after {
    content: "";
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #3a4350;
    top: 10px;
  }
  .plate::before { left: 10px; }
  .plate::after { right: 10px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .led {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px rgba(61, 220, 151, .8);
  }
  h1 {
    margin: 8px 0 2px;
    font-size: 22px;
    letter-spacing: 2px;
  }
  .sub {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--amber);
    letter-spacing: 1px;
  }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 18px 0 0; }
  label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--dim);
    margin: 20px 0 6px;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 18px;
    letter-spacing: 4px;
    text-transform: uppercase;
    outline: none;
  }
  input[type="text"]:focus, input[type="password"]:focus { border-color: var(--amber); }
  input[type="password"] { font-size: 14px; letter-spacing: 2px; text-transform: none; }
  .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button {
    flex: 1;
    min-width: 120px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary {
    background: var(--amber);
    border-color: var(--amber);
    color: #1a1200;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .status {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    min-height: 16px;
    white-space: pre-wrap;
  }
  .status.ok { color: var(--green); }
  .status.err { color: #ff7b72; }
  .card {
    margin-top: 18px;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    background: var(--surface2);
    display: none;
  }
  .card.on { display: block; }
  .call {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 3px;
  }
  .meta {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    margin-top: 4px;
    letter-spacing: 1px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed #3a4350;
  }
  .stat b {
    display: block;
    font-family: var(--mono);
    font-size: 20px;
    color: var(--amber);
  }
  .stat span { font-size: 10px; color: var(--dim); }
  .foot {
    margin-top: 26px;
    text-align: center;
    font-family: var(--mono);
    font-size: 9px;
    color: #4d5868;
    letter-spacing: 1px;
    line-height: 1.8;
  }
  .foot a { color: var(--amber); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="plate">
    <div class="eyebrow"><span class="led"></span>MODEL WC-2025 · SYNC STATION</div>
    <h1>CW练考通</h1>
    <div class="sub">PROGRESS SYNC · 进度同步</div>
    <p class="hint">
      在 App「设置 → 进度同步」中查看同步码，填在下方即可读取网页端进度；
      也可把本机备份 JSON 上传到该同步码。同步码即密钥，请勿公开。
    </p>

    <label for="code">同步码 SYNC CODE</label>
    <input id="code" type="text" maxlength="12" placeholder="例如 K7M2QX" autocomplete="off" />

    <label for="token">访问口令 TOKEN（服务器未启用可留空）</label>
    <input id="token" type="password" placeholder="可选" autocomplete="off" />

    <div class="row">
      <button id="pull" class="primary">读取进度</button>
      <button id="choose">上传备份</button>
      <input id="file" type="file" accept="application/json,.json" hidden />
    </div>
    <div id="status" class="status"></div>

    <section id="card" class="card">
      <div class="call" id="call">—</div>
      <div class="meta" id="meta">—</div>
      <div class="grid">
        <div class="stat"><b id="learn">0</b><span>背码题数</span></div>
        <div class="stat"><b id="copy">0%</b><span>听抄最佳</span></div>
        <div class="stat"><b id="contest">0</b><span>赛事最佳</span></div>
      </div>
      <div class="row">
        <button id="download">下载备份 JSON</button>
      </div>
    </section>
  </header>
  <div class="foot">·−·−  CW练考通 · LOCAL FIRST · 73  ·−·−·<br /><a href="/coach.html">教练看板 ›</a> · <a href="/account.html">账号云同步 ›</a></div>
</div>

<script>
const codeInput = document.getElementById('code')
const tokenInput = document.getElementById('token')
const statusEl = document.getElementById('status')
const card = document.getElementById('card')
let current = null

// 口令只留在当前标签页，关掉即失效
tokenInput.value = sessionStorage.getItem('cw_sync_token') || ''
tokenInput.addEventListener('input', () => {
  sessionStorage.setItem('cw_sync_token', tokenInput.value)
})

function authHeaders(extra) {
  const headers = { ...extra }
  const token = tokenInput.value.trim()
  if (token) headers['x-sync-token'] = token
  return headers
}

function setStatus(text, kind) {
  statusEl.textContent = text
  statusEl.className = 'status' + (kind ? ' ' + kind : '')
}

function codeValue() {
  return (codeInput.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '')
}

function readField(payload, file, key) {
  const one = payload?.prefs?.[file]?.[key]
  return one && typeof one === 'object' ? one.v : undefined
}

codeInput.addEventListener('input', () => {
  codeInput.value = codeValue()
})

document.getElementById('pull').addEventListener('click', async () => {
  const code = codeValue()
  if (code.length < 4) return setStatus('请先填写 4–12 位同步码', 'err')
  setStatus('读取中…')
  try {
    const res = await fetch('/api/sync?code=' + encodeURIComponent(code), {
      headers: authHeaders()
    })
    const data = await res.json()
    if (!res.ok || !data.ok) throw new Error(data.error || '读取失败')
    current = data
    render(data)
    setStatus('已读取 · ' + new Date(data.updatedAt).toLocaleString(), 'ok')
  } catch (error) {
    card.classList.remove('on')
    setStatus(error.message, 'err')
  }
})

function render(data) {
  const p = data.payload
  const trainer = 'wc_trainer'
  const stats = 'wc_stats'
  const callsign = readField(p, trainer, 'callsign') || 'BI1GHP'
  const learn = Number(readField(p, stats, 'learnTotal') || 0)
  const copyBest = Number(readField(p, stats, 'copyBest') || 0)
  const contest = Number(readField(p, stats, 'contestBest') || 0)
  const theme = readField(p, trainer, 'theme') || 'FIELD'
  const version = p.version || '—'

  document.getElementById('call').textContent = callsign
  document.getElementById('meta').textContent =
    'OP ' + (readField(p, trainer, 'opClass') || 'A') +
    ' · 主题 ' + theme + ' · 备份版本 ' + version
  document.getElementById('learn').textContent = learn
  document.getElementById('copy').textContent = Math.round(copyBest * 100) + '%'
  document.getElementById('contest').textContent = contest
  card.classList.add('on')
}

document.getElementById('choose').addEventListener('click', () => {
  if (codeValue().length < 4) return setStatus('请先填写同步码，再上传备份', 'err')
  document.getElementById('file').click()
})

document.getElementById('file').addEventListener('change', async (event) => {
  const file = event.target.files?.[0]
  event.target.value = ''
  if (!file) return
  let payload
  try {
    payload = JSON.parse(await file.text())
  } catch {
    return setStatus('备份文件不是有效的 JSON', 'err')
  }
  if (!payload?.prefs) return setStatus('不是 CW练考通 的备份文件', 'err')

  setStatus('上传中…')
  try {
    const res = await fetch('/api/sync', {
      method: 'POST',
      headers: authHeaders({ 'content-type': 'application/json' }),
      body: JSON.stringify({ code: codeValue(), payload })
    })
    const data = await res.json()
    if (!res.ok || !data.ok) throw new Error(data.error || '上传失败')
    setStatus('已上传 · ' + new Date(data.updatedAt).toLocaleString(), 'ok')
  } catch (error) {
    setStatus(error.message, 'err')
  }
})

document.getElementById('download').addEventListener('click', () => {
  if (!current) return
  const blob = new Blob([JSON.stringify(current.payload, null, 2)], {
    type: 'application/json'
  })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = 'cw_trainer_backup_' + current.code + '.json'
  a.click()
  URL.revokeObjectURL(a.href)
})
</script>
</body>
</html>
